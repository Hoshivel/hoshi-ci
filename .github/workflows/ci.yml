# 本倉庫自己的驗證：三支工具的內建案例、workflow 的公開倉庫檢查，與安全掃描。
#
# **這支拿不到 HOSHIVEL_CI_TOKEN，所以可以掛 `pull_request`**：fork 的 PR 只拿到唯讀的
# GITHUB_TOKEN，沒有任何 secret，而本倉庫沒有快取可讀（`tools/check-workflows.py` 守著）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

# 同一個 PR 上再推一次就取消前一次；`main` 不取消。
concurrency:
  # 草稿 PR 的 opened／synchronize／reopened 不配置任何 job，各自以 run ID 成組：GitHub 不保證
  # 依事件順序建立執行，晚到的這種事件不得取消已就緒的執行。converted_to_draft 與就緒事件
  # 同組，照舊取消前一次執行。
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.action != 'converted_to_draft' && format('-draft-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: 驗證
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # 與 windows.yml 同一個版本。
      - name: 安裝 PyYAML
        run: python -m pip install --disable-pip-version-check --quiet pyyaml==6.0.3

      - run: python tools/dispatch.py selftest
      - run: python tools/run-job.py selftest
      - run: python tools/check-workflows.py selftest
      - run: python tools/check-workflows.py

  # 本倉庫是公開的，掃描不必等 `verify`，同時起跑。
  security:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: 安全掃描
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      # Trivy 上傳 SARIF。
      security-events: write
