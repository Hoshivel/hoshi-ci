# Windows 原生驗證：照被驗證倉庫那個 commit 自己的 `verify-windows` 跑。
#
# 由 `dispatch.yml` 派出，也可手動：
#
#   gh workflow run windows.yml -R Hoshivel/hoshi-ci -f repo=<倉庫> -f pr=<PR 編號> \
#     -f sha=<PR head> -f base=<已凍結 base> -f merge=<已凍結合併提交>
#
# **不在這裡重列指令。** `tools/run-job.py` 讀那個 commit 的 `.github/workflows/ci.yml`，
# 取出 `verify-windows` 照步驟執行；私有倉庫改了那個 job，這裡跑的就跟著改。
#
# **token 出現在哪裡。** HOSHIVEL_CI_TOKEN 用於來源準入、取得 commit 與 `go mod download`。
# 後兩處以 GIT_CONFIG_* 行程環境變數帶入 insteadOf，不寫進任何設定檔。
# 被驗證的程式碼與它的相依在那之後才執行，拿不到它。
#
# **公開日誌裡有什麼。** 本倉庫是公開的：倉庫名、commit、Step 編號、成敗與時間。
# 私有步驟名稱、原始碼、測試及工具鏈輸出不公開。不開快取；不上傳 artifact。
name: Windows
run-name: Windows ${{ inputs.repo }}@${{ inputs.sha }}

on:
  # 只有手動與 `dispatch.yml`。這支拿得到 HOSHIVEL_CI_TOKEN，外人觸發得了的事件
  # 一個都不掛（同 `dispatch.yml`）。
  workflow_dispatch:
    inputs:
      repo:
        description: 被驗證的倉庫（必須列在 targets.json 的 windows）
        required: true
        type: string
      sha:
        description: 40 字元的 PR head SHA（派工去重身分）
        required: true
        type: string
      base:
        description: 凍結時的 40 字元 main base SHA
        required: true
        type: string
      merge:
        description: 凍結時的 40 字元合併 SHA（實際驗證的樹）
        required: true
        type: string
      pr:
        description: 來源倉庫的 Ready PR 編號
        required: true
        type: string

# 同一個 PR head 同時只跑一次；base 前進不建立另一份派工。
concurrency:
  group: windows-${{ inputs.repo }}-${{ inputs.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eligibility:
    name: Ready PR admission
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          SOURCE_TOKEN: ${{ secrets.HOSHIVEL_CI_TOKEN }}
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.sha }}
          BASE: ${{ inputs.base }}
          MERGE: ${{ inputs.merge }}
          PR: ${{ inputs.pr }}
        run: python3 tools/dispatch.py admit --repo "$REPO" --sha "$SHA" --base "$BASE" --merge "$MERGE" --pr "$PR"

  verify:
    name: verify-windows
    needs: eligibility
    if: needs.eligibility.outputs.allowed == 'true'
    runs-on: windows-latest
    # 被驗證 job 自己的 timeout-minutes 由 run-job.py 執行；這裡是整個 job 的上限，
    # 多出來的是 checkout、setup-go 與 module 下載。
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false

      # 輸入經 env 交給腳本，不以 `${{ }}` 直接展開進 shell。
      - name: 檢查輸入
        env:
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.sha }}
          BASE: ${{ inputs.base }}
          MERGE: ${{ inputs.merge }}
          PR: ${{ inputs.pr }}
        run: python ci/tools/dispatch.py check --repo "$REPO" --sha "$SHA" --base "$BASE" --merge "$MERGE" --pr "$PR"

      - name: Recheck Ready PR before source checkout
        id: current
        env:
          SOURCE_TOKEN: ${{ secrets.HOSHIVEL_CI_TOKEN }}
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.sha }}
          BASE: ${{ inputs.base }}
          MERGE: ${{ inputs.merge }}
          PR: ${{ inputs.pr }}
        run: python ci/tools/dispatch.py admit --repo "$REPO" --sha "$SHA" --base "$BASE" --merge "$MERGE" --pr "$PR"

      # 不用 actions/checkout：它會把 commit 標題印進日誌（`HEAD is now at …`），而那是
      # 私有倉庫的內容。這裡自己 fetch，全部帶 -q；憑證的帶法與下載 module 那一步相同。
      - name: 取得被驗證的 commit
        if: steps.current.outputs.allowed == 'true'
        env:
          TOKEN: ${{ secrets.HOSHIVEL_CI_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.merge }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::缺少 HOSHIVEL_CI_TOKEN。本倉庫須可讀此 organization secret；來源準入需要 Contents: read 與 Pull requests: read。"
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          git init -q src
          git -C src remote add origin "https://github.com/${OWNER}/${REPO}"
          if ! git -C src fetch -q --depth=1 --no-tags origin "${SHA}" > "${RUNNER_TEMP}/source-fetch.log" 2>&1; then
            echo "::error::Source fetch failed; private output withheld"
            exit 1
          fi
          if ! git -C src -c advice.detachedHead=false checkout -q FETCH_HEAD > "${RUNNER_TEMP}/source-checkout.log" 2>&1; then
            echo "::error::Source checkout failed; private output withheld"
            exit 1
          fi
          test "$(git -C src rev-parse HEAD)" = "${SHA}"

      - name: 安裝 PyYAML
        if: steps.current.outputs.allowed == 'true'
        run: python -m pip install --disable-pip-version-check --quiet pyyaml==6.0.3

      - name: 讀 verify-windows 的定義
        id: plan
        if: steps.current.outputs.allowed == 'true'
        run: python ci/tools/run-job.py plan --src src --output "${GITHUB_OUTPUT}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.current.outputs.allowed == 'true'
        with:
          go-version-file: src/${{ steps.plan.outputs.go-version-file }}
          # 本倉庫是公開的，fork 的 PR 讀得到預設分支的快取，而這份快取會是私有倉庫的
          # 相依與編譯產物。
          cache: false

      # 唯一碰得到 token 的 Go 步驟。insteadOf 用 GIT_CONFIG_* 環境變數帶入，只活在這個
      # 行程裡：不寫 `~/.gitconfig`，這一步結束它就不存在了。GOPRIVATE 也只放在這一步——
      # 之後的步驟用被驗證 job 自己的 env，與它在私有倉庫跑時一樣。
      - name: 下載 module
        if: steps.current.outputs.allowed == 'true'
        env:
          TOKEN: ${{ secrets.HOSHIVEL_CI_TOKEN }}
          GOPRIVATE: github.com/hoshivel/*
          MODULE_DIR: src/${{ steps.plan.outputs.module-dir }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::缺少 HOSHIVEL_CI_TOKEN。本倉庫須可讀此 organization secret；來源準入需要 Contents: read 與 Pull requests: read。"
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${TOKEN}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          cd "${MODULE_DIR}"
          if ! go mod download > "${RUNNER_TEMP}/mod-download.log" 2>&1; then
            echo "::error::Module download failed; private output withheld"
            exit 1
          fi

      - name: verify-windows
        if: steps.current.outputs.allowed == 'true'
        run: python ci/tools/run-job.py run --src src
